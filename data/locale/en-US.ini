HdrWhiteBalance="HDR White Balance"
HdrWhiteBalance.Info="Color temperature and tint for SDR and HDR sources. Applied as a linear-light per-channel gain, so HDR highlights are kept."
HdrWhiteBalance.Temperature="Color Temperature"
HdrWhiteBalance.Temperature.Description="6500 K = no change. Higher = cooler (bluer), lower = warmer (more yellow)."
HdrWhiteBalance.Tint="Tint"
HdrWhiteBalance.Tint.Description="0 = no change. Positive = magenta, negative = green."
HdrWhiteBalance.Normalize="Brightness Handling"
HdrWhiteBalance.Normalize.Description="Keep brightness: overall brightness stays the same (recommended for HDR). No channel boost: no channel goes above its original level, so SDR whites never clip but the image gets slightly darker. None: raw gains."
HdrWhiteBalance.Normalize.Luminance="Keep brightness"
HdrWhiteBalance.Normalize.NoBoost="No channel boost (SDR clip-safe)"
HdrWhiteBalance.Normalize.None="None"
HdrWhiteBalance.RedGain="Red Fine Tune"
HdrWhiteBalance.GreenGain="Green Fine Tune"
HdrWhiteBalance.BlueGain="Blue Fine Tune"
